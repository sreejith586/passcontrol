name: Build and Deploy

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract lowercase repo owner
        id: vars
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build backend image
        run: |
          docker build -f Dockerfile.backend -t ghcr.io/${{ steps.vars.outputs.owner_lc }}/passcontrol-backend:latest .

      - name: Build frontend image
        run: |
          docker build -f Dockerfile.frontend -t ghcr.io/${{ steps.vars.outputs.owner_lc }}/passcontrol-frontend:latest .

      - name: Push backend image
        run: docker push ghcr.io/${{ steps.vars.outputs.owner_lc }}/passcontrol-backend:latest

      - name: Push frontend image
        run: docker push ghcr.io/${{ steps.vars.outputs.owner_lc }}/passcontrol-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/passcontrol

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            docker compose pull
            docker compose up -d

            docker compose exec -T backend npx prisma migrate deploy