name: Build and Deploy

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build -f Dockerfile.backend \
            -t ghcr.io/sreejith586/passcontrol-backend:${{ github.sha }} .
      - name: Build frontend image
        run: |
          docker build -f frontend/Dockerfile \
          --build-arg VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }} \
          --build-arg VITE_DEMO_INSTANT_ACCESS_KEY=${{ secrets.VITE_DEMO_INSTANT_ACCESS_KEY }} \
          --build-arg VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }} \
          --build-arg VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }} \
          --build-arg VITE_GA4_ID=${{ secrets.VITE_GA4_ID }} \
          -t ghcr.io/sreejith586/passcontrol-frontend:${{ github.sha }} ./frontend

      - name: Push backend image
        run: docker push ghcr.io/sreejith586/passcontrol-backend:${{ github.sha }}

      - name: Push frontend image
        run: docker push ghcr.io/sreejith586/passcontrol-frontend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/passcontrol
            export IMAGE_TAG=${{ github.sha }}

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            docker compose pull
            docker compose up -d

            docker compose exec -T backend npx prisma migrate deploy